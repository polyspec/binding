# The release of binding. It starts by itself when a push run of the workflow ci succeeds on main: it checks out the
# head_sha of that run, and release-tag with AUTO=1 releases the top section ## X.Y.Z of CHANGELOG.md at that commit when
# it is the version commit of that version. A dispatch with the id of a successful CI run releases the commit of that run.
# release-tag tags the commit with vX.Y.Z and appends TAG and VERSION to GITHUB_ENV; the later steps check the tag out,
# install its tools, build the archives of config/release.json, create the GitHub Release of the tag as a draft and make it
# public. The run of ci is the evidence; the release runs no test again. No consumer runs before the release: a consumer
# verifies a release in its own CI after it pins it (GN-14m retired, B2.549). The job has one run step, make ci-release, which
# reads the id of the run and AUTO from the environment of the job (AGENTS.md, B2.278), whose recipe holds the order of these steps and
# reads TAG itself, so a maintainer runs the same call. The job runs on ubuntu-26.04-arm, the actions are pinned by
# commit and no step has a time limit.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run:
        description: The id of the successful CI run whose exact commit is released
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    # A workflow_run starts the release for a successful push or dispatch run of ci alone. The concurrency group is the
    # job's, so one release of the repository runs at a time.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) }}
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04-arm
    env:
      RUN: ${{ inputs.run || github.event.workflow_run.id }}
      AUTO: ${{ github.event_name == 'workflow_run' && '1' || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The whole history, so origin/main is there for the ancestry check of release-tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/bootstrap
      - name: make ci-release
        run: make ci-release

# The checks of binding on GitHub: the push of main and every manual run (workflow_dispatch) run one job per entry of the
# matrix. Every job has one run step, make ci-<job> with the values of its matrix entry as make variables, so a local
# run of the same call is the run of the job (AGENTS.md, B2.278): the recipe of the Makefile holds the order and the
# conditions of the job, and every other step is a uses step that provisions the runner (checkout, the bootstrap, PHP)
# or carries a result (upload-artifact), the only steps with a condition. The entries of check together run every
# target that `make check` runs (the type check and the tests of packages/ts, the tests of binding_core with all
# features and with none, its clippy with both and its format), each once, `make release-coverage`, and `make
# release-candidate-assets`, which builds the archive of the release from the commit with no tag, after the other
# targets of its entry, since it refuses a checkout with an untracked file (B2.455). A failure
# never stops the run: the matrix does not cancel the other entries (fail-fast: false), the recipe runs every check to
# its end, and the upload runs after a failed step (`if: ${{ !cancelled() }}`). make ci-check installs the tools of its
# entry, runs its targets with make ci-targets, writes the job summary and the report var/ci/<name>/ (the status, the
# first failure lines and the full log of each target) and the job uploads it. The last job, ci-passed, passes only
# when every other job of this workflow passed; a release takes the id of such a run and tags its commit
# (.github/workflows/release.yml). The jobs run on ubuntu-26.04-arm (e2e-amd64 on ubuntu-26.04), the actions are
# pinned by commit and no step has a time limit.
#
# Each job runs the bootstrap right after the checkout (uses: ./.github/actions/bootstrap); its recipe then installs
# the tools of its entry with make install-tools: the Rust toolchain of rust-toolchain.toml, which the tests of
# packages/ts also run for cargo fmt. A job that runs the end-to-end check first sets up the PHP of .php-version with
# setup-php, because make install-tools wraps the php of the PATH as it is and the PHP of the runner image is another
# minor; its extensions are those that the PHPUnit of config/phpunit requires. No job waits for another job or reads
# its build output.
#
# The job e2e runs make ci-e2e for each repository of tests/e2e, one entry of its matrix per repository with the
# repositories that its core depends on (DEPS): it installs every tool, runs the end-to-end check (make e2e) in a work
# directory of its own outside the checkout, which is the run of the five targets, and of the released form of the Go
# module (GN-14f), on Linux, then its consumer on musl (make go-musl-check, GN-15g) when the check passed, and removes
# the work directory. An entry whose run fails stays in the matrix and fails ci-passed. Each entry uploads the record
# var/report/e2e/. The end-to-end check of another repository needs a checkout of it and is no job, and a contract of
# tests/e2e whose core depends on a repository that is not in tests/e2e has no entry until a tracked file of the
# contract names a release tag of that repository: tests/e2e/not-in-ci.json lists it with its reason (GN-14g).
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.name }})
    runs-on: ubuntu-26.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ts
            tools: rust
            targets: typecheck-ts unit-ts release-coverage release-candidate-assets
          - name: rust
            tools: rust
            targets: test-rust-features test-rust-plain clippy-rust-features clippy-rust fmt-rust fmt-e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
      - uses: ./.github/actions/bootstrap
        id: bootstrap
      - id: check
        run: make ci-check NAME=${{ matrix.name }} TOOLS="${{ matrix.tools }}" TARGETS="${{ matrix.targets }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: report
        if: ${{ !cancelled() }}
        with:
          name: ci-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/ci/${{ matrix.name }}/
          if-no-files-found: error
  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-26.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: classes
            repo: tests/e2e/classes
            deps: ""
          - name: consumer
            repo: tests/e2e/consumer
            deps: tests/e2e/sample
          - name: functions
            repo: tests/e2e/functions
            deps: ""
          - name: kept
            repo: tests/e2e/kept
            deps: ""
          - name: lent
            repo: tests/e2e/lent
            deps: ""
          - name: plot
            repo: tests/e2e/plot
            deps: tests/e2e/points
          - name: sample
            repo: tests/e2e/sample
            deps: ""
          - name: shapes
            repo: tests/e2e/shapes
            deps: ""
          - name: variants
            repo: tests/e2e/variants
            deps: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
      - uses: ./.github/actions/bootstrap
        id: bootstrap
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        id: php
        with:
          php-version-file: .php-version
          extensions: dom, filter, json, libxml, mbstring, phar, tokenizer, xmlwriter
          tools: none
          coverage: none
      - id: e2e
        run: make ci-e2e REPO=${{ matrix.repo }} DEPS="${{ matrix.deps }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: report
        if: ${{ !cancelled() }}
        with:
          name: e2e-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/report/e2e/
          if-no-files-found: error
  # GN-14g, GN-15g: a release carries the libraries of linux_amd64 and linux_amd64_musl, which only an amd64 machine
  # links and runs, so this job runs the end-to-end check of the sample and its consumer on musl on linux/amd64. It is
  # the one job that does not run on ubuntu-26.04-arm.
  e2e-amd64:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
      - uses: ./.github/actions/bootstrap
        id: bootstrap
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        id: php
        with:
          php-version-file: .php-version
          extensions: dom, filter, json, libxml, mbstring, phar, tokenizer, xmlwriter
          tools: none
          coverage: none
      - id: e2e
        run: make ci-e2e-amd64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: report
        if: ${{ !cancelled() }}
        with:
          name: e2e-amd64-sample-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/report/e2e/
          if-no-files-found: error
  # GN-14m: the consumer gate of a release. One entry for each job of config/consumers.json, whose consumers it clones
  # at their release tags and runs with the CLI and the binding_core of this commit: their install, generate, the
  # generated tests of their targets offline and the release rehearsal with no cache. The matrix is the jobs of the
  # list (packages/ts/tests/consumer-gate.test.ts); a failed entry fails ci-passed, so release.yml does not start. No
  # step restores a cache.
  consumers:
    name: consumers (${{ matrix.job }})
    runs-on: ubuntu-26.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: small
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
      - uses: ./.github/actions/bootstrap
        id: bootstrap
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        id: php
        with:
          php-version-file: .php-version
          extensions: dom, filter, json, libxml, mbstring, phar, tokenizer, xmlwriter
          tools: none
          coverage: none
      - id: consumers
        run: make ci-consumers JOB=${{ matrix.job }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: report
        if: ${{ !cancelled() }}
        with:
          name: consumers-${{ matrix.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/report/consumer-gate/
          if-no-files-found: error
  # The job that fails the run when any other job did not pass, so a release, which takes a successful run by its id,
  # holds every job. It runs after every other job, also after a failed, skipped or cancelled one (if: always()), and
  # make ci-passed fails unless every job of needs has the result success.
  ci-passed:
    if: ${{ always() }}
    needs: [check, e2e, e2e-amd64, consumers]
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bootstrap
      - name: make ci-passed
        run: make ci-passed RESULTS='${{ toJSON(needs) }}' FAIL_SKIPPED=1

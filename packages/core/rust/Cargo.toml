[package]
name = "polyspec-binding-core"
version = "0.0.1"
edition = "2021"
rust-version = "1.99.0"
description = "Runtime support shared by binding's generated binding crates and the core crates they wrap"
repository = "https://github.com/polyspec/binding.git"
license = "MIT"
publish = false

[lib]
name = "binding_core"
path = "src/lib.rs"

[features]
# Makes the wait tokens Io and ProcessWait and the callback exception Raised constructible (design I-2 (4), U-3). Generated binding crates enable it, and a
# core crate enables it only through its dev-dependency, so the library of a core crate, built alone, cannot make a
# token: tests/construct.rs proves both sides.
construct = []
# Holds the locks of class units (design B-5c). The binding crates of Python, Node and PHP enable it; a core crate does
# not, so tokio is no dependency of a core through this crate.
lock = ["dep:tokio"]
# Compiles the arming of fault injection points (design G-5). A point (fault::point!) is judged by the feature
# fault-test of the crate that writes it, which Cargo does not unify (GN-5).
# A core turns it on only through its own feature fault-test, and a binding through that of its core, for tests only.
fault-test = ["dep:serde_json"]
# Runs the future of a member with wait async_driver on the tokio runtime of the process (design I-2 (4), GN-6n). The
# binding crates of PHP, Python and Node of a contract with such a member enable it; a core crate does not.
driver = ["dep:tokio", "tokio/rt-multi-thread"]

[dependencies]
indexmap = { version = "=2.14.2", default-features = false, features = ["std"] }
tokio-util = { version = "=0.7.20", default-features = false }
tokio = { version = "=1.54.1", default-features = false, features = ["sync"], optional = true }
# fault-test only: the list of faults of a case is JSON.
serde_json = { version = "=1.0.154", optional = true }

# An errno symbol has the value of the target (errno::value), which every PHP test reads (GN-8a).
[target.'cfg(unix)'.dependencies]
libc = { version = "=0.2.191", default-features = false }

[dev-dependencies]
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", default-features = false, features = ["macros", "rt", "test-util", "time"] }

# R-1: every warning fails, no unsafe code, no hidden error (P8), every allow attribute names its rule id; clippy.toml
# disallows the unwrap_or and map_or families of Option and Result::ok.
[lints.rust]
warnings = "deny"
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"

[workspace]

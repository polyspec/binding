# R-1: a missing value or an error is never turned into a plausible value. A use that is truly needed carries
# #[allow(clippy::disallowed_methods, reason = "<rule id>")], which allow_attributes_without_reason requires.
disallowed-methods = [
  { path = "core::option::Option::unwrap_or", reason = "R-1: an absent value becomes a plausible one" },
  { path = "core::option::Option::unwrap_or_default", reason = "R-1: an absent value becomes a default" },
  { path = "core::option::Option::unwrap_or_else", reason = "R-1: an absent value becomes a computed fallback" },
  { path = "core::option::Option::map_or", reason = "R-1: an absent value becomes a plausible result" },
  { path = "core::option::Option::map_or_else", reason = "R-1: an absent value becomes a computed result" },
  { path = "core::result::Result::ok", reason = "R-1: an Err becomes None and its error is dropped" },
  { path = "core::result::Result::map_or", reason = "R-1: an Err becomes a plausible result" },
  { path = "core::result::Result::map_or_else", reason = "R-1: an Err becomes a computed result" },
]

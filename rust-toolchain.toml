[toolchain]
channel = "1.99.0"
profile = "minimal"
# llvm-tools holds llvm-nm, which reads the symbols of the Go static library of the end-to-end check (GN-14).
components = ["rustfmt", "clippy", "llvm-tools"]
# The WASM binding is built for wasm32-unknown-unknown (GN-18), and the released form of a Go module of the end-to-end
# check on Linux carries the library of musl of the arch of the run (GN-15g, GN-14f).
targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]

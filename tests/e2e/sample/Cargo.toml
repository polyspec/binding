# A sample repository for the end-to-end check of binding: the items that no polyspec repository generates alone yet.
[workspace]
resolver = "2"
# The binding crates are members as in any repository (GN-4); binding scaffold of the run writes them (GN-14d), because
# their files are of the commit of binding that the run checks.
members = ["packages/rust", "packages/python", "packages/ts", "packages/php-ext", "packages/go/internal/ffi", "packages/ts/wasm"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.99.0"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
